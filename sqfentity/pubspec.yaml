name: sqfentity
homepage: https://github.com/hhtokpinar/sqfEntity
description: SqfEntity ORM for Flutter/Dart lets you build and execute SQL commands easily and quickly with the help of fluent methods similar to .Net Entity Framework.
repository: https://github.com/hhtokpinar/sqfEntity
version: 2.5.0

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite_sqlcipher: ^3.1.0+1
  synchronized: ^3.0.0+2
  path: ^1.8.2
  # [PORT WEB] O repo usa path (monorepo de desenvolvimento), mas aqui o fork é
  # consumido como dependência de um app externo. Apontar para o pacote
  # publicado (mesma versão 2.5.0 do repo) evita ter que overridar também o
  # sqfentity_gen no app — mantendo apenas UM override.
  sqfentity_gen: ^2.5.0
  sqflite_common: ^2.2.1+1
  sqflite_common_ffi: ^2.1.1+1
  meta: ^1.12.0
